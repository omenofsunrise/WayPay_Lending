name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          npm install

      - name: Build project
        run: |
          npm run build

      - name: Deploy to server
        uses: appleboy/ssh-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            echo "Starting deployment..."
            
            # Очищаем папку назначения
            rm -rf /var/www/waypay/*
            
            echo "Waiting for file transfer..."

      - name: Sync built files via SCP
        uses: appleboy/scp-action@master
        with:
          host: 89.104.69.24
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "build/*"
          target: "/var/www/waypay"
          strip_components: 1